# =============================================================
# BONESAW — Jekyll configuration
# Cuts the ossification of the frozen party.
# =============================================================

title: "Bonesaw"
tagline: "Cutting the ossification of the frozen party."
description: >
  A blog of communist history and critique. Notes on revolution,
  organisation, bureaucracy, and the long argument over what a
  workers' party is for.

url: "https://bonesaw-communism.github.io"
baseurl: ""

author:
  name: "The Editors"

markdown: kramdown
highlighter: rouge
permalink: /posts/:year/:month/:title/
timezone: Etc/UTC

paginate: 6
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - README.md