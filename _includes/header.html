<header class="site-header">
  <div class="header-inner">
    <a class="masthead" href="{{ '/' | relative_url }}" aria-label="Bonesaw, return to front page">
      <img class="masthead-mark"
     src="{{ '/assets/img/masthead.png' | relative_url }}"
     alt="Bonesaw masthead"
     width="80" height="80">
      <span class="masthead-text">
        <span class="masthead-title">BONESAW</span>
        <span class="masthead-tagline">{{ site.tagline }}</span>
      </span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Front</a>
      <a href="{{ '/archive/' | relative_url }}">Archive</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </div>
  <div class="header-rule"></div>
</header>
